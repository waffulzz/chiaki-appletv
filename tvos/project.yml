# Xcode project for the tvOS app. Generate ChiakiTV.xcodeproj with:
#   tvos/scripts/build-chiaki-lib.sh && (cd tvos && xcodegen)
name: ChiakiTV
options:
  bundleIdPrefix: com.waffulzz
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.10.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChiakiTV:
    type: application
    platform: tvOS
    sources:
      - path: ChiakiTV
        excludes:
          - Info.plist
    dependencies:
      - framework: build/ChiakiTV.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: VideoToolbox.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_NAME: ChiakiTV
        PRODUCT_BUNDLE_IDENTIFIER: com.waffulzz.chiaki-ng-tv
        INFOPLIST_FILE: ChiakiTV/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: ["-lz"]
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
